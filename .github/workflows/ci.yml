name: CI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  schedule:
    # Nightly verification at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [ gcc, clang ]
    steps:
      - name: Checkout thorn-rs
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Pin Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build (C99, warnings fatal)
        run: make CC=${{ matrix.cc }} CFLAGS="-std=c99 -O2 -Wall -Wextra -Wpedantic -Werror"

      - name: Run Verification Suite
        run: ./tests/verify.sh

  release:
    name: publish tpkg
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout thorn-rs
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build and Install Vendored Pith
        run: |
          make -C vendor/pith
          sudo install -m 755 vendor/pith/pith /usr/local/bin/pith

      - name: Build the .tpkg Bundle
        run: make dist/thorn-rs.tpkg

      - name: Package Release Artifacts
        run: |
          mkdir -p dist/stage
          install -m 0644 dist/thorn-rs.tpkg dist/stage/thorn-rs.tpkg
          install -m 0644 LICENSE dist/stage/LICENSE 2>/dev/null || true
          cd dist/stage
          sha256sum thorn-rs.tpkg > SHA256SUMS.txt

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: "${{ github.ref_name }}"
          prerelease: false
          draft: false
          body: |
            thorn-rs plugin bundle (${{ github.ref_name }}).

            ### Install
            ```toml
            # pith.toml
            [deps]
            thorn-rs = "https://github.com/abit-foggy/thorn-rs/releases/download/${{ github.ref_name }}/thorn-rs.tpkg"
            ```
          files: |
            dist/stage/thorn-rs.tpkg
            dist/stage/SHA256SUMS.txt
